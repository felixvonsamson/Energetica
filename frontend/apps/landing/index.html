<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=0.8" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Baloo+2&family=Expletus+Sans:wght@600&family=Cabin+Condensed"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.css"
            integrity="sha384-Pu5+C18nP5dwykLJOhd2U4Xen7rjScHN/qusop27hdd2drI+lL5KvX7YntvT8yew"
            crossorigin="anonymous"
        />
        <title>Energetica</title>
        <!-- What link previews show. Crawlers do not run JavaScript, so every page
             shares these tags, and they need an absolute image URL. -->
        <meta
            name="description"
            content="A multiplayer strategy game and live workshops about electricity markets and the energy transition."
        />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Energetica" />
        <meta property="og:title" content="Energetica" />
        <meta
            property="og:description"
            content="A multiplayer strategy game and live workshops about electricity markets and the energy transition."
        />
        <meta
            property="og:image"
            content="https://%VITE_APEX_DOMAIN%/og-image.jpg"
        />
        <meta name="twitter:card" content="summary_large_image" />
        <!-- HTML cannot import a package by name, so the logo is reached by its path. -->
        <link
            rel="icon"
            type="image/svg+xml"
            href="../../packages/ui/src/assets/simplified_logo.svg"
        />
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
