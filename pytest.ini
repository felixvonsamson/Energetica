# Pytest runs from the repo root, like every other command, and collects the backend's tests.
# Paths here are relative to this file.
[pytest]
testpaths = backend/tests
# Import `energetica` / `lobby_service` from this checkout's `backend/src/`. A git worktree shares the
# main checkout's .venv, whose editable install points at the main checkout's `backend/src/`;
# without this, tests in a worktree would silently run the main checkout's code.
pythonpath = backend/src
filterwarnings = ignore::DeprecationWarning
python_files = tests/**/*.py
# Exclude the slow, network-dependent external_links tests by default so a bare
# `pytest` matches what CI runs on normal branches and doesn't fail on an offline
# machine. Run them explicitly with `pytest -m external_links`, or the whole suite
# (including them) with `pytest -m ""`. CI runs the full suite on release/* branches.
addopts = -m "not external_links"
markers =
    external_links: tests that make external HTTP requests (slow, network-dependent, run before releases)
