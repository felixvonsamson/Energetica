name: Energetica CI

on:
  push:
    branches: [main, dev, release/*]
  pull_request:
    branches: [main, dev, release/*]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
        working-directory: frontend
      # Runs from the repo root: Prettier covers the whole repo, not just frontend/ (#1325).
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
        working-directory: frontend
      - name: Lint
        run: bun run lint
        working-directory: frontend
      # `bun run test` runs the package's Vitest script. `bun test` would run Bun's own test runner instead.
      - name: Unit tests
        run: bun run test
        working-directory: frontend
      # Typecheck does not run Vite, so a broken build config or an import only the
      # bundler fails to resolve would otherwise reach the deploy.
      - name: Build every bundle
        run: bun run build:all
        working-directory: frontend
      - name: Guard — no raw-HTML rendering of UGC (ADR-0002, #843)
        run: bun run guard:no-raw-html
        working-directory: frontend
      - name: Guard — kebab-case source filenames (#971)
        run: bun run guard:filenames
        working-directory: frontend
      - name: Guard — no fixture data outside tests and /app/internal (#971)
        run: bun run guard:no-dummy-data
        working-directory: frontend
      - name: Guard — served images stay WebP and under the size ceiling (#1073)
        run: bun run guard:image-weight
        working-directory: frontend

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # Named explicitly: pyproject.toml is where the dependencies are declared.
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install: the backend lives under src/ and is imported as an installed
          # package, so nothing resolves off the checkout directory any more.
          pip install -e '.[dev]'
      - name: Pyright
        # Point pyright at the interpreter that has the deps installed; bare
        # pyright resolves against its own bundled env and floods reportMissingImports.
        run: pyright --pythonpath "$(which python)"

  python-lint:
    # Ruff over the whole Python tree, matching the pre-commit hooks (#1081). The hooks
    # auto-fix; here the checks are read-only so CI reports rather than rewrites, and a
    # commit made with --no-verify still gets caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # Named explicitly: pyproject.toml is where the dependencies are declared.
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The dev extra pins ruff to the same version as the pre-commit hook.
          pip install -e '.[dev]'
      - name: Ruff pins agree
        # Ruff is pinned twice — the hook's `rev:` and the dev extra — and nothing else
        # compares them. Two ruffs that disagree about formatting is worse than one, and
        # the drift shows up as a mystery CI failure on an unrelated PR, so check it here.
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import tomllib

          import yaml

          # Parse both files rather than grepping them, so a comment, a reformat or a
          # change of quote style cannot make the guard read the wrong version — or miss.
          config = yaml.safe_load(pathlib.Path(".pre-commit-config.yaml").read_text())
          revs = [
              repo["rev"] for repo in config["repos"] if "ruff-pre-commit" in str(repo.get("repo", ""))
          ]
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          pins = [
              req.replace(" ", "")
              for req in pyproject["project"]["optional-dependencies"]["dev"]
              if req.replace(" ", "").startswith("ruff==")
          ]

          # Neither side may go missing: a guard that silently finds nothing to compare is
          # worse than no guard, because it still reports success.
          if len(revs) != 1:
              sys.exit(f"::error::expected one ruff-pre-commit repo in .pre-commit-config.yaml, found {revs}")
          if len(pins) != 1:
              sys.exit(f"::error::expected one `ruff==` pin in pyproject.toml's dev extra, found {pins}")

          hook = revs[0].lstrip("v")
          extra = pins[0].removeprefix("ruff==")
          if hook != extra:
              sys.exit(f"::error::ruff pins disagree: hook {hook}, dev extra {extra}. Bump both together.")
          print(f"ruff pinned to {extra} in both places")
          PY
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # Named explicitly: pyproject.toml is where the dependencies are declared.
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install: the backend lives under src/ and is imported as an installed
          # package, so nothing resolves off the checkout directory any more.
          pip install -e '.[dev]'
      - name: Run tests
        run: |
          # pyproject's addopts excludes the slow, network-dependent external_links
          # tests by default. On release branches, run the whole suite including them
          # (`-m ""` overrides the default marker filter).
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            pytest -m ""
          else
            pytest
          fi

  wheel-install:
    # The deploy ships a wheel, but every other job here installs the project editable, which
    # resolves straight to src/ and so cannot see a packaging mistake. Anything that depends on
    # what the wheel actually contains — the package-data globs, the __init__.py-less namespace
    # subpackages — is invisible until a server fails to start. So build the real artifact and
    # install it into a clean environment, the way scripts/lib/backend-wheel.sh does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install it into a clean environment
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install -q dist/*.whl
      - name: Check what the wheel carries
        # Run from /tmp so nothing can resolve off the checkout: this must pass against the
        # installed package alone. Imports cover both distributed packages and a module from a
        # namespace subpackage that has no __init__.py; the data check covers package-data.
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/python - <<'PY'
          import energetica, lobby
          from energetica.freeplay.database.map.hex_tile import HexTile
          from energetica.freeplay.database.engine_data.emission_data import EmissionData
          from energetica.freeplay.game_engine import _DATA_DIR as FREEPLAY_DATA_DIR
          from energetica.freeplay.national_demand import national_demand_curve as freeplay_demand_curve
          from energetica.workshop.demand_block import _DATA_DIR as WORKSHOP_DATA_DIR
          from energetica.workshop.demand_block import national_demand_curve as workshop_demand_curve

          expected = {
              FREEPLAY_DATA_DIR: {
                  "daily_quiz_questions.csv",
                  "map.csv",
                  "national_demand_intraday.pck",
                  "national_demand_seasonal.pck",
              },
              WORKSHOP_DATA_DIR: {"national_demand_year_15min.pck"},
          }
          missing = sorted(
              str(data_dir / name)
              for data_dir, names in expected.items()
              for name in names - {p.name for p in data_dir.iterdir()}
          )
          assert not missing, f"package data missing from the wheel: {missing}"
          # Both demand curves load from the installed package, not only sit in it.
          freeplay_demand_curve()
          workshop_demand_curve()
          print(f"energetica {energetica.__version__} from {energetica.__file__}")
          print(f"data files present: {sorted(name for names in expected.values() for name in names)}")
          PY

  api-types-freshness:
    # Regenerate every API types file (the merged api.generated.ts and one
    # api.<app>.generated.ts per app) and fail if any drifts from what's committed.
    # Generation boots the FastAPI apps to emit the OpenAPI schemas (needs Python
    # + deps) then runs openapi-typescript + prettier (needs bun).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # Named explicitly: pyproject.toml is where the dependencies are declared.
          cache-dependency-path: pyproject.toml
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install: the backend lives under src/ and is imported as an installed
          # package, so nothing resolves off the checkout directory any more.
          pip install -e '.[dev]'
      - name: Install frontend dependencies
        run: bun install
        working-directory: frontend
      - name: Regenerate API types
        run: bun run generate-types
      - name: Fail on drift
        run: |
          # The untracked check catches a types file the generator writes but nobody committed.
          generated='frontend/src/types/api*.generated.ts'
          untracked=$(git ls-files --others --exclude-standard -- "$generated")
          if ! git diff --exit-code -- "$generated" || [ -n "$untracked" ]; then
            if [ -n "$untracked" ]; then echo "Not committed: $untracked"; fi
            echo "::error::The generated API types are stale. Run 'bun run generate-types' and commit the result."
            exit 1
          fi
