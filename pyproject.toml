[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energetica"
description = "Energetica — a web game about energy systems, with a focus on electricity."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "apscheduler",
    "bcrypt",
    "requests",
    # fastapi[standard] pulls this in anyway, but replay imports it directly to call the app
    # in-process, so it is declared here rather than relied on as a transitive dependency.
    "httpx",
    "pandas",
    "pywebpush",
    # pywebpush pulls this in anyway, but we import it directly to generate the VAPID
    # keypair, so it is declared here rather than relied on as a transitive dependency.
    "cryptography",
    "noise",
    # Pinned: these determine the generated OpenAPI schema, so the api-types
    # freshness check (CI) is only reproducible if their versions are fixed.
    "pydantic==2.11.5",
    "fastapi[standard]==0.115.12",
    # ASGI/websocket server deps (uvicorn, websockets, wsproto) come from fastapi[standard];
    # python-socketio dropped its 'asgi' extra by 5.16.x, so requesting it only warns.
    "python-socketio",
    "itsdangerous",
]

[project.optional-dependencies]
# Everything needed to develop and check the backend, on top of the runtime deps, so that
# `pip install -e '.[dev]'` is the whole local setup step. The deploy installs the project
# without this extra — the server runs the code, it does not check it.
# ruff is pinned to the same version as the `rev:` in .pre-commit-config.yaml. Bump the two
# together: two ruffs that disagree about formatting is worse than one.
# import-linter is pinned too, because its contract options change between releases, and a new
# release that reads [tool.importlinter] differently should not fail CI on an unrelated PR.
dev = ["pytest", "pyright==1.1.407", "pre-commit", "ruff==0.12.10", "import-linter==2.16"]

[project.urls]
Homepage = "https://github.com/felixvonsamson/Energetica"
Issues = "https://github.com/felixvonsamson/Energetica/issues"

[tool.setuptools]
# src/ layout: only the two backend packages ship. `tests`, `scripts` and `map_generation`
# live outside src/ and are deliberately not part of the distribution.
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# Namespace packages are discovered (the default here), which is load-bearing: a few real
# subpackages — energetica.freeplay.database.engine_data, energetica.freeplay.database.map — have no
# __init__.py and would otherwise be dropped from the wheel.
namespaces = true
# ...which also means every directory under src/energetica counts, including freeplay/data/ and
# workshop/data/. Exclude them: they hold no Python, and what ships from them is named explicitly as
# package data below. The patterns are globs, so name the package and its children exactly: a bare
# "energetica.freeplay.data*" would also match energetica.freeplay.database.
exclude = [
    "energetica.freeplay.data",
    "energetica.freeplay.data.*",
    "energetica.workshop.data",
    "energetica.workshop.data.*",
]

[tool.setuptools.dynamic]
# Read from the module's AST at build time, so building never imports the package.
version = { attr = "energetica.__version__" }

[tool.setuptools.package-data]
# The data tables are the only non-Python files in the wheel. The persistent world's own tables sit
# next to the game engine that reads them (#1055). Workshop's demand curve sits in workshop/data/, next to
# the demand block that reads it (#1201). No web assets ship here: since #1064 the app bundle and
# its service worker are built to frontend/apps/freeplay/dist/ and served by Apache straight off the rsynced
# tree (docs/architecture/static-serving-and-deployment.md), never read through the installed
# package.
energetica = ["freeplay/data/*", "workshop/data/*"]

[tool.ruff]
line-length = 120 # Let's keep this at 120 for now, there are some files that need it
target-version = "py312"
# Where import sorting looks for first-party modules. scripts/workshop_bots/ runs as a script, so
# its sibling modules (api, market, strategies) import as top-level names and would otherwise
# sort as third-party.
src = [".", "src", "scripts/workshop_bots"]
# Every rule below applies to the whole Python tree — tests/ and scripts/ included. There are
# deliberately no per-file-ignores (#1081): when the hooks were widened past src/energetica/,
# the rest of the tree already satisfied the docstring rules (D100, D400, D415) with nothing
# to fix, so relaxing them there would only have licensed new violations. If a docstring rule
# ever becomes genuinely unwanted in tests/ or scripts/, relax it here rather than narrowing
# the hooks again.
lint.select = [
    "D100",
    "D200",
    "D201",
    "D202",
    "D209",
    # "D213",
    "D400",
    "D415",
    "F401",
    # "TD004", TODOs
    "PIE794",
    "ANN001",
    "ANN201",
    "F404",
    "I",
    "N",
]
# select = ["ALL"]
lint.ignore = [
    "D212",
    "ANN401",
    "RET503",
    "DTZ005",
    "COM812",
    # N818 wants every exception class named `...Error`. PEP 8 asks for that only when the
    # exception really is an error, and none of the four it flagged when N landed (#969) was:
    # two are a service's documented refusal, two are test signals. It cannot tell the difference.
    "N818",
]

[tool.pyright]
include = ["src", "tests", "scripts", "main.py", "main_lobby.py"]
# Resolve `energetica` / `lobby` from the source tree. An editable install points at them
# through a generated import hook that pyright cannot follow, so name the directory here.
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Resolve imports against the project venv so a bare `pyright` sees installed deps
# (pydantic, pytest, …) instead of flooding reportMissingImports against its own
# bundled environment. CI still passes --pythonpath explicitly as belt-and-suspenders.
venvPath = "."
venv = ".venv"

[tool.importlinter]
# Which packages may import which, checked by `lint-imports` in CI (#1051). This is the backend
# counterpart of the frontend's rule against imports between apps (frontend/boundaries.test.ts).
# Each rule is a contract. Contracts cover indirect imports too: A importing B importing C counts
# as A importing C.
# lobby_service has no contract of its own yet, but it is analysed so that chains through it count.
root_packages = ["energetica", "lobby", "lobby_service"]

# The freeplay code is not one package yet (#1057 carves it): it is energetica.freeplay plus the
# top-level modules it still owns. The same list appears in four places below, and
# tests/unit/test_import_contracts.py fails if they differ. A module that moves into
# energetica.freeplay comes out of all four.

[[tool.importlinter.contracts]]
name = "kernel, identity and sim are layered below the apps, and entry sits above them"
type = "layers"
containers = ["energetica"]
# Every top-level module of energetica must be named in a layer, so a new one cannot slip past the
# contracts below unclassified.
exhaustive = true
layers = [
    # Builds whichever app this instance runs (#994), so it imports both.
    "entry",
    # App code. A higher layer may import a lower one, never the reverse. Within a layer, ":" lets
    # these modules import each other; the per-app contracts below keep the apps apart.
    "workshop : freeplay : init_test_players : routers : schemas : simulate : socketio : utils",
    "sim",
    "identity",
    "kernel",
]

[[tool.importlinter.contracts]]
name = "kernel, identity and sim import none of the lobby"
type = "forbidden"
source_modules = ["energetica.kernel", "energetica.identity", "energetica.sim"]
forbidden_modules = ["lobby"]

[[tool.importlinter.contracts]]
name = "Workshop imports neither the lobby nor the freeplay code"
type = "forbidden"
source_modules = ["energetica.workshop"]
# energetica.entry is not listed: the layers contract already keeps Workshop from importing it.
forbidden_modules = [
    "lobby",
    "energetica.freeplay",
    "energetica.init_test_players",
    "energetica.routers",
    "energetica.schemas",
    "energetica.simulate",
    "energetica.socketio",
    "energetica.utils",
]

[[tool.importlinter.contracts]]
name = "The lobby imports neither Workshop nor the freeplay code"
type = "forbidden"
source_modules = ["lobby"]
forbidden_modules = [
    "energetica.entry",
    "energetica.workshop",
    "energetica.freeplay",
    "energetica.init_test_players",
    "energetica.routers",
    "energetica.schemas",
    "energetica.simulate",
    "energetica.socketio",
    "energetica.utils",
]

[[tool.importlinter.contracts]]
name = "The freeplay code imports neither Workshop nor the lobby"
type = "forbidden"
source_modules = [
    "energetica.freeplay",
    "energetica.init_test_players",
    "energetica.routers",
    "energetica.schemas",
    "energetica.simulate",
    "energetica.socketio",
    "energetica.utils",
]
forbidden_modules = ["energetica.workshop", "lobby"]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
# Import `energetica` / `lobby` from this checkout's `src/`. A git worktree shares the main
# checkout's .venv, whose editable install points at the main checkout's `src/`; without
# this, tests in a worktree would silently run the main checkout's code.
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
python_files = "tests/**/*.py"
# Exclude the slow, network-dependent external_links tests by default so a bare
# `pytest` matches what CI runs on normal branches and doesn't fail on an offline
# machine. Run them explicitly with `pytest -m external_links`, or the whole suite
# (including them) with `pytest -m ""`. CI runs the full suite on release/* branches.
addopts = ["-m", "not external_links"]
markers = [
    "external_links: tests that make external HTTP requests (slow, network-dependent, run before releases)",
]
