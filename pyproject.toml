[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energetica"
description = "Energetica — a web game about energy systems, with a focus on electricity."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "apscheduler",
    "bcrypt",
    "ecdsa",
    "requests",
    "pandas",
    "pywebpush",
    "noise",
    # Pinned: these determine the generated OpenAPI schema, so the api-types
    # freshness check (CI) is only reproducible if their versions are fixed.
    "pydantic==2.11.5",
    "fastapi[standard]==0.115.12",
    # ASGI/websocket server deps (uvicorn, websockets, wsproto) come from fastapi[standard];
    # python-socketio dropped its 'asgi' extra by 5.16.x, so requesting it only warns.
    "python-socketio",
    "itsdangerous",
]

[project.optional-dependencies]
# Everything needed to develop and check the backend, on top of the runtime deps, so that
# `pip install -e '.[dev]'` is the whole local setup step. The deploy installs the project
# without this extra — the server runs the code, it does not check it.
dev = ["pytest", "pyright==1.1.407", "pre-commit"]

[project.urls]
Homepage = "https://github.com/felixvonsamson/Energetica"
Issues = "https://github.com/felixvonsamson/Energetica/issues"

[tool.setuptools]
# src/ layout: only the two backend packages ship. `tests`, `scripts` and `map_generation`
# live outside src/ and are deliberately not part of the distribution.
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
# Namespace packages are discovered (the default here), which is load-bearing: a few real
# subpackages — energetica.database.engine_data, energetica.database.map — have no
# __init__.py and would otherwise be dropped from the wheel.
namespaces = true
# ...which also means every directory under src/energetica counts, including the web-asset
# trees. Exclude them: they hold no Python, and what does ship from static/ is named
# explicitly as package data below.
exclude = ["energetica.static*"]

[tool.setuptools.dynamic]
# Read from the module's AST at build time, so building never imports the package.
version = { attr = "energetica.__version__" }

[tool.setuptools.package-data]
# Only the game's own data tables ship inside the wheel. The web assets under `static/app`,
# `static/images` and `static/service-worker.js` are served by Apache straight off the
# rsynced tree (docs/architecture/static-serving-and-deployment.md) rather than read through
# the installed package, and `static/images` alone is around 110 MB.
energetica = ["static/data/*"]

[tool.ruff]
line-length = 120 # Let's keep this at 120 for now, there are some files that need it
target-version = "py312"
lint.select = [
    "D100",
    "D200",
    "D201",
    "D202",
    "D209",
    # "D213",
    "D400",
    "D415",
    "F401",
    # "TD004", TODOs
    "PIE794",
    "ANN001",
    "ANN201",
    "F404"
]
# select = ["ALL"]
lint.ignore = [
    "D212",
    "ANN401",
    "RET503",
    "DTZ005",
    "COM812",
]

[tool.pyright]
include = ["src", "tests", "scripts", "main.py", "main_lobby.py"]
# Resolve `energetica` / `lobby` from the source tree. An editable install points at them
# through a generated import hook that pyright cannot follow, so name the directory here.
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Resolve imports against the project venv so a bare `pyright` sees installed deps
# (pydantic, pytest, …) instead of flooding reportMissingImports against its own
# bundled environment. CI still passes --pythonpath explicitly as belt-and-suspenders.
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
filterwarnings = ["ignore::DeprecationWarning"]
python_files = "tests/**/*.py"
# Exclude the slow, network-dependent external_links tests by default so a bare
# `pytest` matches what CI runs on normal branches and doesn't fail on an offline
# machine. Run them explicitly with `pytest -m external_links`, or the whole suite
# (including them) with `pytest -m ""`. CI runs the full suite on release/* branches.
addopts = ["-m", "not external_links"]
markers = [
    "external_links: tests that make external HTTP requests (slow, network-dependent, run before releases)",
]
