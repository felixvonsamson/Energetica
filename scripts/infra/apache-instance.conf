# Apache vhost for a single game instance: @INSTANCE@.@DOMAIN@
#
# Rendered by scripts/infra/update-instance-vhost.sh, which substitutes the placeholders
# @INSTANCE@ (kebab-case slug), @PORT@ (the port, read from the instance's own instance.env),
# @DOMAIN@ (apex domain). setup-instance.sh calls that script, and nothing else renders this
# file, so an edit here reaches a live instance by rerunning it — push from your machine, then
# run it on the VPS as root (not through ssh as the deploy user, which has no sudo for it):
#
#   ./scripts/push-bootstrap.sh --server <ssh-host>
#   sudo bash /tmp/update-instance-vhost.sh <instance> --domain <apex-domain>
#
# ${APACHE_LOG_DIR} is a literal Apache runtime variable — do NOT substitute it.
#
# Apache serves the static app bundle (images included, hashed inside it), service
# worker and PWA manifest directly from disk; only dynamic traffic (/api, /socket.io,
# /logout) is proxied to the per-instance uvicorn process on 127.0.0.1:@PORT@.
#
# See docs/architecture/static-serving-and-deployment.md § Request routing.

<VirtualHost *:80>
    ServerName @INSTANCE@.@DOMAIN@
    DocumentRoot /var/www/energetica-@INSTANCE@

    # ACME http-01 challenges (certbot --webroot -w /var/www/energetica-@INSTANCE@) must be
    # served over plain HTTP and never redirected, or certificate issuance/renewal breaks.
    <Directory "/var/www/energetica-@INSTANCE@/.well-known/acme-challenge">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName @INSTANCE@.@DOMAIN@

    # DocumentRoot is the app bundle so the SPA fallback below resolves index.html.
    DocumentRoot /var/www/energetica-@INSTANCE@/src/energetica/static/app

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/@INSTANCE@.@DOMAIN@/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/@INSTANCE@.@DOMAIN@/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    # --- Static content served directly by Apache ---------------------------------
    # Explicit aliases (not DocumentRoot path math) so each public path maps to the
    # right directory regardless of DocumentRoot.
    Alias /static/app    /var/www/energetica-@INSTANCE@/src/energetica/static/app
    # Dangling since #1078 moved the image tree into the bundles: the target directory no
    # longer exists, so this and its <Directory> grant below resolve to a 404 — for a path
    # nothing requests any more. Left in place deliberately. #1064 removes both lines in
    # the same vhost migration that retargets the aliases above, so the two changes share
    # one migration window instead of needing one each.
    Alias /static/images /var/www/energetica-@INSTANCE@/src/energetica/static/images
    Alias /service-worker.js /var/www/energetica-@INSTANCE@/src/energetica/static/service-worker.js
    # PWA requirement: manifest must be reachable at the root path. It ships inside
    # the app bundle and is per-instance (may later carry instance-specific metadata).
    Alias /manifest.json /var/www/energetica-@INSTANCE@/src/energetica/static/app/manifest.json

    # Deny the static/ tree by default, then grant back only what has an Alias above.
    # static/ also holds data/, which the game engine reads off the filesystem and no HTTP
    # client asks for — see § Request routing in the doc named above for what is in there
    # and why none of it is public.
    # The deny has to be explicit: Ubuntu's stock apache2.conf grants all of /var/www/, so
    # dropping an Alias alone would leave the files readable through any URL that later
    # happens to map into this tree.
    # app/ inherits Options -Indexes from the static/ block above. The service worker is
    # granted by URL, not by filename, so the grant covers exactly the aliased path rather
    # than that basename at any depth under static/.
    <Directory "/var/www/energetica-@INSTANCE@/src/energetica/static">
        Require all denied
        Options -Indexes
    </Directory>
    <Directory "/var/www/energetica-@INSTANCE@/src/energetica/static/app">
        Require all granted
    </Directory>
    <Directory "/var/www/energetica-@INSTANCE@/src/energetica/static/images">
        Require all granted
    </Directory>
    <Location "/service-worker.js">
        Require all granted
    </Location>

    # --- Caching ------------------------------------------------------------------
    # Content-hashed bundles (the filename IS a content hash, e.g. index-Dt2SAy2m.js) never
    # change in place, so cache them forever — a content change ships a new filename.
    # "Header set" (not "always") is deliberate: it writes onsuccess only, so a 404 for a
    # pruned/missing hashed asset is NOT given the year-long immutable directive (an "always"
    # rule here would cache transient errors for a year). The /app/* SPA fallback is scoped
    # below, so a missing /static/app/assets/* path returns a real 404, not the shell.
    <LocationMatch "^/static/app/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # These stable-named entry points change between deploys and must ALWAYS be revalidated.
    # deploy-instance.sh rsyncs with --delete, so a deploy renames the hashed bundles and prunes
    # the old ones; without this they ship with no Cache-Control and browsers cache them
    # heuristically — a returning visitor would keep loading a stale index.html referencing
    # now-404 bundles until that window lapsed. ETag makes revalidation a cheap 304.
    #   - *.html: the SPA shell — also the FallbackResource /app/* target (resolved file is
    #     index.html in both cases).
    #   - service-worker.js: never pin a client to an outdated worker.
    #   - manifest.json: stable-named PWA manifest, may change between deploys.
    <FilesMatch "^(.*\.html|service-worker\.js|manifest\.json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    # --- Dynamic traffic proxied to uvicorn ---------------------------------------
    ProxyPreserveHost On
    ProxyTimeout 300

    # mod_proxy doesn't forward the original scheme, so tell the backend it's HTTPS.
    # src/energetica/utils/auth.py keys the session cookie's Secure flag off this header;
    # without it the cookie is issued without Secure even though the site is HTTPS-only.
    RequestHeader set X-Forwarded-Proto "https"

    # WebSocket upgrade for Socket.IO. Must precede the plain /socket.io ProxyPass so
    # upgrade requests are tunnelled (mod_rewrite [P]) rather than proxied as HTTP.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*)$ ws://127.0.0.1:@PORT@/socket.io/$1 [P,L]

    ProxyPass        /socket.io/ http://127.0.0.1:@PORT@/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:@PORT@/socket.io/
    ProxyPass        /api        http://127.0.0.1:@PORT@/api
    ProxyPassReverse /api        http://127.0.0.1:@PORT@/api
    ProxyPass        /logout     http://127.0.0.1:@PORT@/logout
    ProxyPassReverse /logout     http://127.0.0.1:@PORT@/logout
    # /healthz is mounted at the uvicorn root (no /api/v1 prefix), so it needs its own rule.
    # deploy-instance.sh polls https://{fqdn}/healthz after a restart; without this it 404s.
    ProxyPass        /healthz    http://127.0.0.1:@PORT@/healthz
    ProxyPassReverse /healthz    http://127.0.0.1:@PORT@/healthz

    # --- SPA routing --------------------------------------------------------------
    # Bare root → the React client router (which lives under /app/).
    RedirectMatch ^/$ /app/
    # Sign-up moved under /app in RFC Phase 1. This redirect is an instance-local
    # convenience so {instance}.{domain}/sign-up still reaches the form. It does
    # NOT cover the legacy bookmarks from the pre-cutover single app, which pointed
    # at the apex ({domain}/sign-up) — the apex is now the pure-static landing
    # vhost, and redirecting it would have to pick a target instance. That
    # apex-side stale-link handling is deferred to the instance-picker work (#810).
    # 301 (permanent): sign-up moved under /app for good, matching the old FastAPI
    # 301. RedirectMatch defaults to 302 without an explicit status.
    RedirectMatch 301 ^/sign-up/?$ /app/sign-up
    # SPA fallback scoped to /app/* ONLY: an /app/... path with no backing file serves the
    # app shell and the client router takes over. Scoping it here (rather than a vhost-wide
    # FallbackResource) means a *missing* hashed asset under /static/ returns a clean 404
    # instead of index.html-with-200 — which a browser would try to execute as JS/CSS and
    # fail on — and a stray /.well-known 404 on :443 is likewise not masked. Real static
    # files are served directly; the proxied prefixes above are matched before this.
    <LocationMatch "^/app(/|$)">
        FallbackResource /static/app/index.html
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/energetica-@INSTANCE@-error.log
    CustomLog ${APACHE_LOG_DIR}/energetica-@INSTANCE@-access.log combined
</VirtualHost>
