# Apache vhost left behind for a torn-down run that has a recap: @INSTANCE@.@DOMAIN@
#
# Rendered by scripts/infra/teardown-instance.sh, which substitutes @INSTANCE@ (kebab-case slug)
# and @DOMAIN@ (apex domain). It replaces the run's full vhost (apache-instance.conf) when the
# run is torn down, so that old links, bookmarks and browser autocomplete land on the run's recap
# instead of on another site's certificate. See #1378 and #1380.
#
# The run keeps its own certificate, and this vhost keeps serving ACME http-01 challenges out of
# the run's web folder. The certificate's renewal config names that folder as its webroot, so
# without both of these certbot cannot renew it and the warning comes back within 90 days.
#
# Removed, together with the certificate and the web folder, when the recap is deleted: delete
# recaps/@INSTANCE@.json on the landing dir and re-run teardown-instance.sh.
#
# The redirect is a 302, not a 301: a browser caches a 301 indefinitely, and the recap is not
# meant to live at that address forever.
#
# ${APACHE_LOG_DIR} is a literal Apache runtime variable — do NOT substitute it.

<VirtualHost *:80>
    ServerName @INSTANCE@.@DOMAIN@
    DocumentRoot /var/www/energetica-@INSTANCE@

    # ACME http-01 challenges must be served over plain HTTP and never redirected.
    <Directory "/var/www/energetica-@INSTANCE@/.well-known/acme-challenge">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://lobby.@DOMAIN@/runs/@INSTANCE@/recap [R=302,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName @INSTANCE@.@DOMAIN@

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/@INSTANCE@.@DOMAIN@/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/@INSTANCE@.@DOMAIN@/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5

    # Every path, including the old /app/... deep links, goes to the recap.
    RedirectMatch 302 ^ https://lobby.@DOMAIN@/runs/@INSTANCE@/recap

    ErrorLog ${APACHE_LOG_DIR}/energetica-@INSTANCE@-error.log
    CustomLog ${APACHE_LOG_DIR}/energetica-@INSTANCE@-access.log combined
</VirtualHost>
