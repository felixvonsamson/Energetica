repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Kept in lockstep with the `ruff==` pin in pyproject.toml's dev extra —
    # bump the two together, so the hook and a local `ruff` agree about formatting.
    rev: v0.12.10
    hooks:
      # Both hooks cover every Python file in the repo (#1081). They used to carry
      # `files: ^src/energetica/`, which silently skipped tests/, scripts/, src/lobby/,
      # map_generation/, main.py and main_lobby.py. The same scope is enforced by the
      # `python-lint` job in CI, so `--no-verify` no longer bypasses it.
      # Run the linter for python.
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      # Run the formatter for python.
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # Frontend formatting + linting, mirroring the ruff hooks above. These run prettier/eslint
      # DIRECTLY (pre-commit passes the staged filenames and re-stages), rather than via lint-staged:
      # lint-staged does its own git-stash dance, and nested inside pre-commit (which already stashes)
      # the two collide, so lint-staged's fixes never reached the staged blob and misformatted code
      # slipped through to CI. pre-commit hands us repo-root-relative paths, so strip the leading
      # `frontend/` after cd-ing in. --write/--fix (not --check): mirror ruff — auto-fix, and
      # pre-commit fails the commit when files change so you re-stage.
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && npx prettier --write "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx)$
      # --no-warn-ignored: naming a file eslint's config ignores (src/service-worker.ts) makes
      # it emit a "File ignored because of a matching ignore pattern" warning, which
      # --max-warnings 0 then turns into a failed commit. `bun run lint` never hits this — it
      # walks the tree and skips ignored files silently — so the trap only springs here, on
      # any commit that touches the worker. The flag suppresses that one warning class and
      # leaves the zero-tolerance budget intact for real ones.
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint --max-warnings 0 --no-warn-ignored --fix --cache "${@#frontend/}"' --
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && bun run typecheck'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
